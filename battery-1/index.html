<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bias · Neurotical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./lesson.css" />
    <link rel="icon" type="image/png" href="../images/circles.png" />
    <script src="./app.js" type="module"></script>
  </head>
  <body class="is-loading lesson-page">
    <header class="header">
      <div class="header__title">
        <h1 class="header__heading">Neurotical</h1>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="../battery-2/">Next →</a></li>
        </ul>
      </nav>
    </header>
    <div class="page">
      <div class="page__loading-text">Loading...</div>
      <main class="page__main lesson">
        <article class="essay">
          <header class="essay__header">
            <p class="essay__eyebrow">Phone battery · Stage 1</p>
            <h2 class="essay__title">Bias</h2>
          </header>

          <p>
            Will the phone make it through the day? The neuron adds a <strong>bias</strong> to the battery level, and
            predicts “made it” when the sum is 0 or more. Drag the bias to move the cutoff.
          </p>

          <figure class="lab">
            <div class="lab__bar">
              <div class="buttons">
                <button id="reset" class="button">reset</button>
              </div>
              <label class="field">
                <span class="field__label">data</span>
                <select id="dataset"></select>
              </label>
              <dl class="readouts">
                <div class="readout">
                  <dt>correct</dt>
                  <dd id="accuracy"></dd>
                </div>
                <div class="readout">
                  <dt>cutoff</dt>
                  <dd id="cutoff"></dd>
                </div>
              </dl>
            </div>

            <div class="lab__views">
              <div class="lab__column">
                <div class="tile">
                  <h3 class="tile__title">What the neuron predicts</h3>
                  <canvas id="canvas" class="plot"></canvas>
                  <div class="legend">
                    <span class="legend__item"><span class="swatch" style="--color: var(--pass)"></span>made it</span>
                    <span class="legend__item"><span class="swatch" style="--color: var(--fail)"></span>died</span>
                  </div>
                  <div class="toggles">
                    <label><input type="checkbox" id="show-network" checked />show network</label>
                    <label><input type="checkbox" id="show-output" />show output</label>
                  </div>
                </div>

                <div class="tile">
                  <h3 class="tile__title">Inside the neuron</h3>
                  <svg class="neuron" viewBox="0 0 500 160" font-size="13" text-anchor="middle">
                    <defs>
                      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" />
                      </marker>
                    </defs>

                    <!-- Input -->
                    <text x="45" y="26" fill="dimgray">input</text>
                    <rect x="5" y="35" width="80" height="44" rx="6" fill="white" stroke="black" />
                    <text id="neuron-input" x="45" y="62" font-weight="bold"></text>
                    <text id="neuron-percent" x="45" y="98" fill="dimgray"></text>
                    <line x1="85" y1="57" x2="208" y2="57" stroke="black" marker-end="url(#arrow)" />

                    <!-- The neuron adds the input and the bias -->
                    <circle cx="250" cy="57" r="40" fill="white" stroke="black" stroke-width="2" />
                    <text x="250" y="48" fill="dimgray">sum</text>
                    <text id="neuron-sum" x="250" y="70" font-weight="bold"></text>

                    <!-- Bias -->
                    <rect x="200" y="120" width="100" height="32" rx="6" fill="white" stroke="dimgray" />
                    <text id="neuron-bias" x="250" y="141"></text>
                    <line x1="250" y1="120" x2="250" y2="99" stroke="dimgray" marker-end="url(#arrow)" />

                    <!-- Output -->
                    <line x1="290" y1="57" x2="408" y2="57" stroke="black" marker-end="url(#arrow)" />
                    <text x="452" y="26" fill="dimgray">output</text>
                    <rect x="410" y="35" width="85" height="44" rx="6" fill="white" stroke="black" />
                    <text id="neuron-output" x="452" y="62" font-weight="bold"></text>
                    <text id="neuron-prediction" x="452" y="98" font-weight="bold"></text>
                  </svg>
                  <div id="neuron-equation" class="equation"></div>
                </div>
              </div>

              <div class="lab__column">
                <div class="tile">
                  <h3 class="tile__title">Prediction</h3>
                  <div id="battery" class="prediction__point">battery: --</div>
                  <div class="prediction">
                    <div id="prediction" class="prediction__mushroom">
                      <div id="prediction-label" class="prediction__label"></div>
                      <div id="prediction-output" class="prediction__value"></div>
                    </div>
                  </div>
                  <p class="tile__hint">Hover over the plot to try a battery level. Click to pin it, and double-click to let it go.</p>
                </div>

                <div class="tile">
                  <h3 class="tile__title">Bias</h3>
                  <div class="network-controls__network">
                    <div class="layer">
                      <div class="node output">
                        <div class="control">
                          <label for="bias">bias</label>
                          <input type="range" id="bias" class="control__input" min="-1" max="1" step="any" />
                          <span id="bias-value" class="control__value"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <figcaption class="caption">
              Each dot is a day: the battery level when leaving the house, colored by whether the phone lasted until
              bedtime. With <strong>show output</strong> on, each example sits on the threshold, and its output sits on
              the line above or below it.
            </figcaption>
          </figure>
        </article>
      </main>
    </div>
  </body>
</html>
